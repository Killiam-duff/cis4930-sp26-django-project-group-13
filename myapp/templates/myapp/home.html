{% extends "myapp/base.html" %}
{% load static %}

{% block content %}

<div class="home-container">

    <div class="home-header">
        <h1>Baseball/Weather Dashboard</h1>
        <p>An overview of batting and weather records.</p>
    </div>

    <div class="home-stats">
        <div class="stat-box">
            <h2>{{ total_records }}</h2>
            <p>Total Records</p>
        </div>
    </div>

    <div class="home-links">
        <a href="{% url 'records' %}" class="home-link">View Records</a>
        <a href="{% url 'analytics' %}" class="home-link">View Analytics</a>
    </div>

</div>

{% endblock %}
