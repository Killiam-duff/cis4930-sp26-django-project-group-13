{% extends "myapp/base.html" %}
{% block title %} Items {%endblock%}

{%block content%} 
<h1>Items</h1>
{%if items %}
<table border="1">
    <tr>
        <th> Name </th>
        <th> Category </th>
        <th> Price </th>
    </tr>
    {% for item in items%}
    <tr>
        <td> {{item.name}}</td>
        <td> {{item.category}}</td>
        <td> {{item.price}}</td>
    </tr>
    {%endfor%}
</table>
{%else%}
<p>No items available</p>
{%endif%}



{%endblock%}
