{% extends 'myapp/base.html' %}

{% block content %}

<h2>Analytics</h2>

<canvas id="chart"></canvas>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>
const data = JSON.parse('{{ chart_json|safe }}');

new Chart(document.getElementById("chart"), {
    type: "bar",
    data: {
        labels: data.labels,
        datasets: [{
            label: "Sample Data",
            data: data.values
        }]
    }
});
</script>

{% endblock %}
